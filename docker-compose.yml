services:
  db:
    # Official PostGIS image is amd64; Docker Desktop emulates on Apple silicon.
    platform: linux/amd64
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: casinodb
      POSTGRES_PASSWORD: casinodb
      POSTGRES_DB: casinodb
    ports:
      - "5432:5432"
    volumes:
      - casinodb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casinodb -d casinodb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casinodb_pgdata:
